<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin Dashboard | PreetoMind Academy</title>
<style>
:root{--or:#E8731A;--dk:#1E1F22;--bg:#f4f2ee;--card:#fff;--bd:#e2ded7;--mu:#666a72;--ok:#1f7a45;--bad:#b42318;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dk);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--dk);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b span{color:var(--or)}header .r{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.82rem}header a{color:#fff;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--or);color:#fff}nav i{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;margin-left:6px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.stat b{display:block;font-size:1.7rem;color:var(--or)}.stat span{color:var(--mu);font-size:.85rem}
h2{margin:0 0 10px;font-size:1.15rem}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--dk)}
textarea{min-height:60px;resize:vertical}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--or);color:#fff;text-decoration:none;display:inline-block}
.btn.g{background:#fff;color:var(--dk);border:1px solid var(--bd)}.btn.d{background:#fff;color:var(--bad);border:1px solid var(--bd)}.btn.s{padding:5px 10px;font-size:.8rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.item{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:10px;background:#fff}.item.new{border-left:4px solid var(--or)}
.meta{color:var(--mu);font-size:.85rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.t-pub{color:var(--ok)}.t-hid{color:var(--mu)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:8px 0;font-size:.9rem}dt{color:var(--mu)}dd{margin:0;word-break:break-word;white-space:pre-wrap}
.hide{display:none}.msg{padding:10px 12px;border-radius:8px;background:#fff7ef;border-left:4px solid var(--or);margin-bottom:12px}.msg.e{background:#fdeceb;border-color:var(--bad)}
#login{max-width:380px;margin:60px auto}
select.st{width:auto;padding:5px 8px}
</style></head><body>
<header><b>PreetoMind <span>Academy</span> &middot; Admin</b><div class="r"><span id="upd"></span><a href="index.html">View website</a><a href="#" id="out" class="hide">Log out</a></div></header>

<div id="login" class="card">
  <h2>Admin login</h2><div id="lmsg" class="msg e hide"></div>
  <label for="pw" style="font-weight:600;font-size:.85rem">Password</label>
  <input id="pw" type="password" autocomplete="current-password" style="margin:4px 0 12px">
  <button class="btn" id="go" style="width:100%">Log in</button>
</div>

<div id="app" class="hide">
<nav id="tabs"></nav>
<main>
  <div id="amsg" class="msg e hide"></div>
  <section id="p-home"><div class="stats" id="stats"></div>
    <div class="card" style="margin-top:14px"><h2>Latest activity</h2><div id="latest"></div></div></section>
  <section id="p-enquiry" class="hide"><div class="card"><h2>Admission enquiries</h2>
    <div class="bar"><select id="f-enquiry" class="st"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Demo</option><option>Admitted</option><option>Closed</option></select>
    <button class="btn g s" data-csv="enquiry">Download CSV</button></div><div id="l-enquiry"></div></div></section>
  <section id="p-review" class="hide"><div class="card"><h2>Student reviews</h2>
    <p class="meta">Only reviews you click <b>Publish</b> on appear on the website. Check the student's permission first.</p><div id="l-review"></div></div></section>
  <section id="p-team" class="hide"><div class="card"><h2>Team applications</h2>
    <div class="bar"><button class="btn g s" data-csv="team">Download CSV</button></div><div id="l-team"></div></div></section>
</main></div>

<script>
(function(){
var KEY='pm_admin_pw',pw='',items=[],tab='home',timer=null;
try{pw=sessionStorage.getItem(KEY)||'';}catch(e){}
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var LABEL={student_name:'Student',parent_name:'Parent',parent_mobile:'Parent mobile',email:'Email',class_course:'Class / Course',school_college:'School / College',city:'City',subjects:'Subjects',preferred_timing:'Preferred timing',message:'Message',full_name:'Name',phone:'Phone',role:'Role',team:'Team',education:'Education',skills:'Skills',availability:'Availability',link:'Link',name:'Name',review:'Review',permission_to_publish:'Permission to publish'};
var TABS=[['home','Overview'],['enquiry','Enquiries'],['review','Reviews'],['team','Team']];
function title(r){var d=r.data||{};return d.student_name||d.full_name||d.name||'(no name)';}
function when(r){try{return new Date(r.created_at).toLocaleString();}catch(e){return '';}}
function call(body){
  return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+pw},body:JSON.stringify(body)})
   .then(function(r){return r.json().catch(function(){return {};}).then(function(j){j.__s=r.status;return j;});});
}
function showErr(m){var n=$('amsg');n.textContent=m||'';n.classList.toggle('hide',!m);}
function logout(msg){pw='';try{sessionStorage.removeItem(KEY);}catch(e){}clearInterval(timer);$('app').classList.add('hide');$('out').classList.add('hide');$('login').classList.remove('hide');var l=$('lmsg');l.textContent=msg||'';l.classList.toggle('hide',!msg);}
function load(first){
  return call({action:'list'}).then(function(j){
    if(j.__s===401){logout('Wrong password.');return;}
    if(j.error){if(first){logout(j.error);}else{showErr(j.error);}return;}
    showErr('');items=j.items||[];if(first){$('login').classList.add('hide');$('app').classList.remove('hide');$('out').classList.remove('hide');
      try{sessionStorage.setItem(KEY,pw);}catch(e){}clearInterval(timer);timer=setInterval(function(){if(!document.hidden)load(false);},30000);}
    $('upd').textContent='Updated '+new Date().toLocaleTimeString();render();
  }).catch(function(){var m='Could not reach the server.';if(first){logout(m);}else{showErr(m);}});
}
function pending(t){return items.filter(function(r){return r.type===t&&(t==='review'?!r.published:r.status==='New');}).length;}
function renderTabs(){$('tabs').innerHTML=TABS.map(function(x){var n=x[0]==='home'?0:pending(x[0]);return '<button data-t="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+(n?'<i>'+n+'</i>':'')+'</button>';}).join('');
  var n=pending('enquiry')+pending('review')+pending('team');document.title=(n?'('+n+') ':'')+'Admin Dashboard | PreetoMind Academy';}
function card(r){
  var d=r.data||{},rows=Object.keys(d).filter(function(k){return d[k];}).map(function(k){return '<dt>'+esc(LABEL[k]||k)+'</dt><dd>'+esc(d[k])+'</dd>';}).join('');
  var head='<div><b>'+esc(title(r))+'</b> <span class="meta">'+esc(when(r))+'</span> ';
  var ctl='';
  if(r.type==='review'){head+='<span class="tag '+(r.published?'t-pub':'t-hid')+'">'+(r.published?'Published':'Not published')+'</span>';
    ctl='<button class="btn s'+(r.published?' g':'')+'" data-a="pub" data-id="'+r.id+'">'+(r.published?'Hide from website':'Publish')+'</button>';}
  else{head+='<select class="st" data-a="status" data-id="'+r.id+'">'+['New','Contacted','Demo','Admitted','Closed'].map(function(s){return '<option'+(r.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>';
    var ph=String(d.parent_mobile||d.phone||'').replace(/[^0-9]/g,'');if(ph){ctl+='<a class="btn g s" target="_blank" rel="noopener" href="https://wa.me/'+(ph.length===10?'91'+ph:ph)+'">WhatsApp</a>';}
    if(d.email){ctl+=' <a class="btn g s" href="mailto:'+esc(d.email)+'">Email</a>';}}
  head+='</div>';
  return '<div class="item'+(r.type!=='review'&&r.status==='New'||r.type==='review'&&!r.published?' new':'')+'" data-id="'+r.id+'">'+head+'<dl>'+rows+'</dl>'+
   '<textarea data-n="'+r.id+'" placeholder="Private notes">'+esc(r.notes||'')+'</textarea><div class="bar">'+ctl+'<button class="btn g s" data-a="note" data-id="'+r.id+'">Save note</button><button class="btn d s" data-a="del" data-id="'+r.id+'">Delete</button></div></div>';}
function list(t){var f=t==='enquiry'?$('f-enquiry').value:'';var a=items.filter(function(r){return r.type===t&&(!f||r.status===f);});$('l-'+t).innerHTML=a.length?a.map(card).join(''):'<p class="meta">Nothing here yet.</p>';}
function render(){renderTabs();
  var c=function(t){return items.filter(function(r){return r.type===t;}).length;};
  $('stats').innerHTML=[[c('enquiry'),'Enquiries'],[pending('enquiry'),'New enquiries'],[c('review'),'Reviews'],[items.filter(function(r){return r.type==='review'&&r.published;}).length,'Published'],[c('team'),'Team applications']].map(function(x){return '<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>';}).join('');
  $('latest').innerHTML=items.slice(0,6).map(function(r){return '<p style="margin:4px 0"><b>'+esc(title(r))+'</b> <span class="meta">'+esc(r.type)+' &middot; '+esc(when(r))+'</span></p>';}).join('')||'<p class="meta">No submissions yet. When someone fills a form on your website, it appears here.</p>';
  ['enquiry','review','team'].forEach(list);
  TABS.forEach(function(x){$('p-'+x[0]).classList.toggle('hide',x[0]!==tab);});}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;render();}});
$('f-enquiry').onchange=function(){list('enquiry');};
function find(id){return items.filter(function(r){return r.id===id;})[0];}
document.addEventListener('change',function(e){var s=e.target.closest('select[data-a=status]');if(!s)return;
  call({action:'update',id:s.dataset.id,status:s.value}).then(function(j){if(j.error){showErr(j.error);}else{var r=find(s.dataset.id);if(r)r.status=s.value;showErr('');render();}});});
document.addEventListener('click',function(e){
  var csv=e.target.closest('[data-csv]');
  if(csv){var t=csv.dataset.csv,a=items.filter(function(r){return r.type===t;}),keys=[];a.forEach(function(r){Object.keys(r.data||{}).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k);});});
    var q=function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
    var rows=[['Date','Status'].concat(keys)].concat(a.map(function(r){return [r.created_at,r.status].concat(keys.map(function(k){return (r.data||{})[k];}));}));
    var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.map(function(x){return x.map(q).join(',');}).join('\n')],{type:'text/csv'}));l.download=t+'.csv';document.body.appendChild(l);l.click();l.remove();return;}
  var b=e.target.closest('button[data-a]');if(!b||b.tagName!=='BUTTON')return;var id=b.dataset.id,r=find(id);if(!r)return;
  if(b.dataset.a==='pub'){var go=r.published||(r.data&&r.data.permission_to_publish==='yes')||confirm('This reviewer did not tick the permission box. Publish anyway?');if(!go)return;
    call({action:'update',id:id,published:!r.published}).then(function(j){if(j.error){showErr(j.error);}else{r.published=!r.published;showErr('');render();}});}
  else if(b.dataset.a==='note'){var ta=document.querySelector('textarea[data-n="'+id+'"]');call({action:'update',id:id,notes:ta.value}).then(function(j){if(j.error){showErr(j.error);}else{r.notes=ta.value;showErr('');b.textContent='Saved';setTimeout(function(){b.textContent='Save note';},1200);}});}
  else if(b.dataset.a==='del'){if(confirm('Delete this permanently?')){call({action:'delete',id:id}).then(function(j){if(j.error){showErr(j.error);}else{items=items.filter(function(x){return x.id!==id;});showErr('');render();}});}}
});
$('go').onclick=function(){pw=$('pw').value;if(!pw)return;load(true);};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click();});
$('out').onclick=function(e){e.preventDefault();logout('');};
if(pw){load(true);}
})();
</script></body></html>

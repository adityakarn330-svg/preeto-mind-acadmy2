<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Student Login | PreetoMind Academy"><link rel="icon" href="assets/preetomind-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/styles.css"><style>.portal{max-width:520px;margin:60px auto}.portal-card{background:#fff;border:1px solid #e2ded7;border-radius:16px;padding:28px;box-shadow:0 16px 40px #1e1f2212}.portal-card label{display:block;font-weight:700;margin:14px 0 6px}.portal-card input{width:100%;padding:12px;border:1px solid #d8d2ca;border-radius:8px;font:inherit}.portal-card button{width:100%;margin-top:20px}.portal-msg{padding:12px;border-radius:8px;margin-top:16px;background:#fdeceb;color:#8b211c}.portal-msg.ok{background:#e9f7ef;color:#1f7a45}.small-note{color:#666a72;font-size:.9rem}</style></head><body><main class="portal container"><div class="portal-card"><a class="brand" href="index.html"><img class="brand-logo" src="assets/preetomind-logo.svg" alt="PreetoMind Academy" width="52" height="52"><span class="brand-text"><span class="brand-name">PREETOMIND <span>ACADEMY</span></span><span class="brand-tag">STUDENT PORTAL</span></span></a><div class="eyebrow" style="margin-top:28px">Private student area</div><h1>Student login</h1><p class="small-note">Use the Student ID and password given to you by PreetoMind Academy after enrolment.</p><form id="login"><label for="student_id">Student ID</label><input id="student_id" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">Log in to my reports</button><div id="msg" class="portal-msg" hidden></div></form><p class="small-note" style="margin-top:24px">If you cannot sign in, contact the academy directly for a password reset.</p></div></main><script>(function(){var f=document.getElementById('login'),m=document.getElementById('msg');f.addEventListener('submit',function(e){e.preventDefault();m.hidden=true;var b=f.querySelector('button');b.disabled=true;b.textContent='Signing in…';fetch('/api/student-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:document.getElementById('student_id').value,password:document.getElementById('password').value})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){if(x.ok){location.href='student-dashboard.html';}else{m.textContent=x.j.error||'Could not sign in.';m.hidden=false;}}).catch(function(){m.textContent='Could not reach the server.';m.hidden=false;}).finally(function(){b.disabled=false;b.textContent='Log in to my reports';});});})();</script></body></html>
